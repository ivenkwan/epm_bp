# R0 toolchain baseline configuration. Environment-specific values arrive via config/environments.
quarkus.application.name=finance-admin
quarkus.http.root-path=/
quarkus.http.test-port=0
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migrations
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=apache/age:release_PG17_1.7.0
quarkus.datasource.devservices.reuse=false
quarkus.hibernate-orm.database.generation=none
