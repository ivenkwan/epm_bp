# R0 toolchain baseline configuration. Environment-specific values arrive via config/environments.
quarkus.application.name=finance-core
quarkus.http.root-path=/
quarkus.http.test-port=0
# Telemetry: traces and metrics export over OTLP to the platform collector; the endpoint
# is environment configuration, exporter types are build-time fixed.
quarkus.otel.metrics.exporter=otlp
quarkus.otel.traces.exporter=otlp
