# R0 toolchain baseline configuration. Environment-specific values arrive via config/environments.
quarkus.application.name=finance-core
quarkus.http.root-path=/
quarkus.http.test-port=0
# Telemetry: traces and metrics export over OTLP to the platform collector; the endpoint
# is environment configuration, exporter types are build-time fixed.
quarkus.otel.metrics.exporter=otlp
quarkus.otel.traces.exporter=otlp
# Migrations: canonical SQL lives at repository db/migrations/, copied into the artifact.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migrations
# Unit tests use Quarkus dev services (containerized PostgreSQL); the platform cluster
# overrides these settings through environment configuration.
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=apache/age:release_PG17_1.7.0
quarkus.datasource.devservices.reuse=false
quarkus.hibernate-orm.database.generation=none
