receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch:
    timeout: 5s
  # Local redaction guard: drop attributes that must never reach telemetry.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: authorization
        action: delete
      - key: cookie
        action: delete
  resource/labels:
    attributes:
      - key: epm.environment
        value: dev
        action: upsert
      - key: epm.product
        value: epm-finance
        action: upsert
      - key: epm.cost_center
        value: platform
        action: upsert

exporters:
  # Local sink: received pipeline health is exposed on the collector's own metrics endpoint
  # (:8888); received application metrics with resource attributes converted to labels are
  # re-exposed on :8889 so governance labels are observable evidence.
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    metrics:
      level: detailed
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/labels, attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/labels, attributes/redact, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/labels, attributes/redact, batch]
      exporters: [debug]
