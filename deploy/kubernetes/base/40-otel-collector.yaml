# OpenTelemetry collector for the local platform; the configuration itself lives in
# deploy/observability/otel-collector.yaml and is mounted via the kustomize
# configMapGenerator (see kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: epm-system
  labels:
    app: otel-collector
spec:
  type: NodePort
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
      nodePort: 30088
    - name: recv-metrics
      port: 8889
      targetPort: 8889
      nodePort: 30089
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: epm-system
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: epm-finance
    epm.io/cost-center: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/part-of: epm-finance
        epm.io/cost-center: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: collector
          image: otel/opentelemetry-collector:0.117.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 8889
              name: recv-metrics
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            # The collector always serves its own metrics on :8888; use that as the
            # readiness signal (no health extension is configured).
            tcpSocket:
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
