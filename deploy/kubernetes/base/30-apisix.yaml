# APISIX edge gateway (standalone/yaml configuration; rendered config assembled by
# scripts/setup/install-local-dependencies.sh from deploy/apisix/*.yaml).
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: epm-system
  labels:
    app: apisix
spec:
  type: NodePort
  selector:
    app: apisix
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      nodePort: 30080
    - name: prometheus
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: epm-system
  labels:
    app: apisix
    app.kubernetes.io/part-of: epm-finance
    epm.io/cost-center: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
        app.kubernetes.io/part-of: epm-finance
        epm.io/cost-center: platform
    spec:
      securityContext:
        # Matches the apisix image's own uid/gid (636) so config/log writes succeed.
        runAsNonRoot: true
        runAsUser: 636
        runAsGroup: 636
        fsGroup: 636
      initContainers:
        - name: wait-for-keycloak
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - "until curl -sf http://keycloak.epm-system.svc.cluster.local:8080/realms/epm/.well-known/openid-configuration >/dev/null; do echo waiting for keycloak; sleep 3; done"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
        # APISIX yaml-provider mode needs conf/config.yaml (main config) plus
        # conf/apisix.yaml (routes), and persists its instance id into config.yaml,
        # so both live in a writable copy of the image's conf directory.
        - name: stage-config
          image: apache/apisix:3.13.0-debian
          command:
            - sh
            - -c
            - >-
              cp -r /usr/local/apisix/conf/. /conf-target/ &&
              cp /conf-src/config.yaml /conf-target/config.yaml &&
              cp /conf-src/apisix.yaml /conf-target/apisix.yaml &&
              chmod 666 /conf-target/config.yaml /conf-target/apisix.yaml
          volumeMounts:
            - name: apisix-config
              mountPath: /conf-src
              readOnly: true
            - name: apisix-conf
              mountPath: /conf-target
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: apisix
          image: apache/apisix:3.13.0-debian
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9091
              name: prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            # The /apisix/status control endpoint is bound to localhost by default;
            # the gateway port is the portability signal.
            tcpSocket:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: apisix-conf
              mountPath: /usr/local/apisix/conf
            - name: apisix-logs
              mountPath: /usr/local/apisix/logs
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
        - name: apisix-conf
          emptyDir: {}
        - name: apisix-logs
          emptyDir: {}
