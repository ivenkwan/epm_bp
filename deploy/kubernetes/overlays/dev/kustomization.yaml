apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: finance-core
    newTag: r0

patches:
  - target:
      kind: Deployment
      name: finance-core
    patch: |
      - op: replace
        path: /metadata/labels/environment
        value: dev
