apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: finance-core
    newTag: r2

# Test overlay: test-sized resources and NodePort conventions per
# config/environments/test.yaml (28080/28081/28888 via the cluster port map).
patches:
  - target:
      kind: Deployment
      name: finance-core
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
